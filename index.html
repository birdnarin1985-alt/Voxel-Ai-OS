<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voxel AI OS : New Connected Master Edition</title>
    <style>
        :root {
            --bg-color: #010203;
            --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(0, 243, 255, 0.02));
            --glass-border: 1px solid rgba(0, 243, 255, 0.2);
            --cyan-core: #00f3ff; --gold-core: #f39c12; --magenta-core: #ff00ff; --green-core: #00ff66;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg-color); font-family: 'Segoe UI', Tahoma, sans-serif; color: white; user-select: none; touch-action: none; }
        
        #webgl-canvas { position: absolute; top: 0; left: 0; z-index: 1; width: 100%; height: 100%; }
        #shadow-dom { position: absolute; top: -9999px; left: -9999px; width: 320px; font-size: 24px; font-weight: bold; line-height: 1.5; word-wrap: break-word; visibility: hidden; }

        /* UI LAYER */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .top-bar { display: flex; justify-content: space-between; pointer-events: auto; }
        .glass-pill { background: rgba(0,0,0,0.6); border: var(--glass-border); padding: 8px 16px; border-radius: 20px; font-size: 0.75rem; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 4px 15px rgba(0,0,0,0.6); font-weight: bold; cursor: pointer; }
        
        .hud-panel {
            background: var(--glass-bg); border: var(--glass-border); border-top: 1px solid rgba(255,255,255,0.2); border-radius: 24px;
            padding: 20px; backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); pointer-events: auto;
            max-width: 420px; margin: 0 auto; box-shadow: 0 10px 40px rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 12px; position: relative;
        }
        .header { display: flex; justify-content: space-between; align-items: center; color: var(--gold-core); font-weight: bold; text-shadow: 0 0 10px var(--gold-core); border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .model-identity { font-family: 'Courier New', monospace; font-size: 0.7rem; color: var(--green-core); text-align: center; padding: 6px; border: 1px dashed rgba(0,255,102,0.3); border-radius: 12px; }

        .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .btn-glass { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); color: white; padding: 10px 5px; border-radius: 12px; font-size: 0.65rem; font-weight: bold; cursor: pointer; transition: all 0.3s; text-align: center; }
        .btn-glass:hover { background: rgba(0, 243, 255, 0.15); border-color: var(--cyan-core); box-shadow: 0 0 15px rgba(0,243,255,0.3); }
        .btn-glass.active { background: rgba(243, 156, 18, 0.2); border-color: var(--gold-core); color: var(--gold-core); text-shadow: 0 0 10px var(--gold-core); }

        .voice-btn { background: rgba(255, 0, 255, 0.1); border-color: var(--magenta-core); color: var(--magenta-core); grid-column: span 3; font-size: 0.8rem; padding: 12px;}
        .voice-btn.listening { background: var(--magenta-core); color: white; box-shadow: 0 0 20px var(--magenta-core); animation: pulse 1s infinite; }
        .p2p-btn { background: rgba(0, 255, 102, 0.1); border-color: var(--green-core); color: var(--green-core); grid-column: span 3; }
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        .log-box { font-family: 'Courier New', monospace; font-size: 0.65rem; color: #ddd; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 10px; height: 60px; overflow-y: auto; border-left: 2px solid var(--green-core); }
        .log-sys { color: var(--gold-core); } .log-ai { color: var(--cyan-core); } .log-p2p { color: var(--green-core); font-weight: bold;}

        /* MODALS */
        .app-modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 20; backdrop-filter: blur(5px); flex-direction: column; justify-content: center; align-items: center; padding: 20px; pointer-events: auto;}
        .modal-panel { background: var(--glass-bg); border: 1px solid var(--cyan-core); padding: 20px; border-radius: 20px; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 0 30px rgba(0,243,255,0.2); }
        .modal-panel h3 { color: var(--cyan-core); font-size: 0.9rem; text-align: center; }
        textarea, input[type="text"] { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 10px; border-radius: 10px; font-size: 0.6rem; width: 100%; font-family: monospace;}
        textarea { height: 60px; resize: none; }
    </style>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.150.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.150.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>
    <div id="shadow-dom"></div>

    <div id="ui-layer">
        <div class="top-bar">
            <div class="glass-pill" style="color:var(--cyan-core);" onclick="openKeyModal()">🔑 ตั้งค่า Auth Key</div>
            <div class="glass-pill" id="telemetry">FPS: 60</div>
        </div>

        <div class="hud-panel">
            <div class="header">🪷 VOXEL AI : RECURSIVE CORE</div>
            <div class="model-identity" id="hud-model-name">🌱 PROTOCOL: Fully Connected Graph</div>
            
            <div class="btn-grid">
                <button class="btn-glass active" id="btn-zen" onclick="switchState('ZEN')">🧘‍♂️ สภาวะฌาน</button>
                <button class="btn-glass" id="btn-mag" onclick="switchState('MAGAZINE')">📖 โฮโลแกรม Voxel</button>
                <button class="btn-glass" id="btn-music" onclick="playTone(440, 0, 0.5)">🎶 นาทพรหม</button>
                <button class="btn-glass voice-btn" id="btn-mic" onclick="toggleListening()">🎙 ส่งกระแสจิตผ่านกราฟพอยเตอร์</button>
                <button class="btn-glass p2p-btn" onclick="openP2P()">🍄 เชื่อมโยงไมคอร์ไรซา (P2P)</button>
            </div>

            <div class="log-box" id="sys-log"></div>
        </div>
    </div>

    <!-- KEY SETTING MODAL -->
    <div id="key-modal" class="app-modal">
        <div class="modal-panel">
            <h3>ตั้งค่า Auth Key (Local Storage)</h3>
            <label style="font-size:0.7rem; color:#aaa;">ใส่ Auth Key ของท่าน (ปลอดภัย ไม่บันทึกขึ้น GitHub)</label>
            <input type="text" id="inputApiKey" placeholder="วาง Auth Key ที่นี่...">
            <div style="display:flex; gap:5px; margin-top:10px;">
                <button class="btn-glass" style="flex:1; border-color:var(--cyan-core);" onclick="saveApiKey()">บันทึกกุญแจ</button>
                <button class="btn-glass" style="flex:1; color:#ff4444;" onclick="document.getElementById('key-modal').style.display='none'">ปิดหน้าต่าง</button>
            </div>
        </div>
    </div>

    <!-- P2P MODAL -->
    <div id="p2p-modal" class="app-modal">
        <div class="modal-panel" style="border-color:var(--green-core); box-shadow: 0 0 30px rgba(0,255,102,0.2);">
            <h3 style="color:var(--green-core);">สานเส้นใยไมคอร์ไรซา (WebRTC)</h3>
            <label style="font-size:0.7rem; color:#aaa;">1. สปอร์ของเรา</label>
            <textarea id="myOffer" readonly placeholder="สร้างสปอร์..."></textarea>
            <div style="display:flex; gap:5px;">
                <button class="btn-glass" style="flex:1; border-color:var(--green-core);" onclick="createOffer()">สร้างสปอร์</button>
                <button class="btn-glass" style="flex:1;" onclick="copyMyOffer()">คัดลอก</button>
            </div>
            <label style="font-size:0.7rem; color:#aaa; margin-top:10px;">2. สปอร์ของสหาย</label>
            <textarea id="friendOffer" placeholder="วางสปอร์ของสหายที่นี่..."></textarea>
            <div style="display:flex; gap:5px;">
                <button class="btn-glass" style="flex:1; border-color:var(--gold-core);" onclick="acceptOffer()">รับสปอร์</button>
                <button class="btn-glass" style="flex:1; border-color:var(--cyan-core);" onclick="finalizeConnection()">ประสานจิต</button>
            </div>
            <button class="btn-glass" style="margin-top:10px; color:#ff4444;" onclick="document.getElementById('p2p-modal').style.display='none'">ปิดหน้าต่าง</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // ==========================================
        // 💎 SYSTEM CONFIG & SECURE AUTH MANAGER
        // ==========================================
        const SYSTEM_CONFIG = {
            SCENE: { cameraX: 0.0, cameraY: 0.0, cameraZ: 13.0, lookAtY: 0.0, elevation: 4.0, bloomStrength: 1.2, bloomRadius: 0.3, bloomThreshold: 0.2 },
            CORE: { radius: 1.5, tube: 0.4, tubularSegments: 60, radialSegments: 12, speedX: 0.3, speedY: 0.5 },
            VOXEL: { maxCount: 1500, size: 0.08, spreadArea: 10.0, morphSpeed: 3.0 },
            TYPOGRAPHY: { scale: 0.045, elevationOffset: 5.0, densityPerChar: 3, jitter: 0.05, depth: 0.1 },
            AUDIO: { synthVolume: 0.2 }
        };

        const AUTH_CONFIG = {
            endpoint: "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-lite:generateContent",
            getKey() { return localStorage.getItem('VOXEL_AI_AUTH_KEY') || ""; }
        };

        window.openKeyModal = () => {
            document.getElementById('inputApiKey').value = AUTH_CONFIG.getKey();
            document.getElementById('key-modal').style.display = 'flex';
        };
        window.saveApiKey = () => {
            const key = document.getElementById('inputApiKey').value.trim();
            if(key) {
                localStorage.setItem('VOXEL_AI_AUTH_KEY', key);
                logMsg("บันทึก Auth Key ลงใน Local Storage ปลอดภัยเรียบร้อย", "sys");
                document.getElementById('key-modal').style.display = 'none';
            } else {
                logMsg("กรุณากรอก Auth Key ให้ถูกต้อง", "sys");
            }
        };

        const SYS = { state: 'ZEN', logs: [] };
        function logMsg(msg, type = 'sys') {
            const t = new Date().toLocaleTimeString();
            SYS.logs.push({ t, msg, type }); if(SYS.logs.length > 6) SYS.logs.shift();
            const logEl = document.getElementById('sys-log');
            logEl.innerHTML = SYS.logs.map(l => `<div class="log-${l.type}">[${l.t}] ${l.msg}</div>`).join('');
            logEl.scrollTop = logEl.scrollHeight;
        }

        // ==========================================
        // 🪷 KARMA & RECURSIVE GRAPH ENGINE (New Connected State)
        // ==========================================
        class KarmaRecursiveEngine {
            constructor() {
                this.stateGraph = {
                    node: "INTENT_PARSING",
                    next: {
                        node: "CLOUD_TEACHER_SYNTHESIS",
                        next: {
                            node: "HOLOGRAPHIC_MANIFESTATION",
                            next: null
                        }
                    }
                };
            }

            parseKarma(inputRaw) {
                logMsg(`[Karma Parser] วิเคราะห์เหตุ: "${inputRaw}"`, "sys");
                return {
                    intent: inputRaw.includes("เพื่อน") || inputRaw.includes("เครือข่าย") ? "P2P_SYNC" : "CLOUD_REASONING",
                    scope: "RECURSIVE_POINTER_GRAPH",
                    targetOutcome: "VOXEL_RENDER",
                    payload: inputRaw
                };
            }

            async fetchCloudTeacherGraph(graphPayload) {
                const apiKey = AUTH_CONFIG.getKey();
                if(!apiKey) {
                    logMsg("[Local Fallback] ยังไม่ใส่ Auth Key ใช้ระบบ Local Standalone", "sys");
                    return `Voxel AI (Local): ${graphPayload.payload}`;
                }

                logMsg(`[Cloud Teacher] ส่งโครงสร้างกราฟปรึกษา Gemini...`, "ai");
                try {
                    const response = await fetch(AUTH_CONFIG.endpoint, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{ text: `[Recursive Pointer Graph Protocol]: กรุณาตอบกลับเป็นข้อความสั้นกระชับสำหรับแสดงผลโฮโลแกรม: ${graphPayload.payload}` }]
                            }]
                        })
                    });

                    if (!response.ok) throw new Error(`Cloud status: ${response.status}`);
                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || "Voxel AI บรรลุธรรม";
                } catch (error) {
                    logMsg(`[Fallback] ใช้ Local Mode เนื่องจาก: ${error.message}`, "sys");
                    return `Voxel AI (Local Mode): ${graphPayload.payload}`;
                }
            }

            async traverse(node, karmaData, callback) {
                if (!node) {
                    logMsg("[Recursive Graph] บรรลุปลายทางโครงสร้างกรรม", "p2p");
                    return;
                }

                logMsg(`[State Machine] ประมวลผลโหนด: ${node.node}`, "ai");

                if (node.node === "INTENT_PARSING") {
                    await new Promise(r => setTimeout(r, 100));
                    return this.traverse(node.next, karmaData, callback);
                } 
                else if (node.node === "CLOUD_TEACHER_SYNTHESIS") {
                    const cloudThought = await this.fetchCloudTeacherGraph(karmaData);
                    callback(cloudThought); // ส่งผลลัพธ์ผ่าน callback ทันที
                    await new Promise(r => setTimeout(r, 100));
                    return this.traverse(node.next, karmaData, callback);
                } 
                else if (node.node === "HOLOGRAPHIC_MANIFESTATION") {
                    logMsg("[Manifestation] เนรมิตโครงสร้างกราฟสู่วิสัยทัศน์สำเร็จ", "sys");
                }
            }
        }

        const karmaEngine = new KarmaRecursiveEngine();

        // --- P2P MYCORRHIZAL NETWORK ---
        let peerConnection, dataChannel;
        const p2pConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        window.isP2PConnected = false;

        function initP2P() {
            peerConnection = new RTCPeerConnection(p2pConfig);
            peerConnection.onicecandidate = e => {
                if(e.candidate) return; 
                document.getElementById('myOffer').value = btoa(JSON.stringify(peerConnection.localDescription));
            };
            peerConnection.ondatachannel = e => { dataChannel = e.channel; setupChannel(); };
        }
        function setupChannel() {
            dataChannel.onopen = () => { logMsg("ประสานเส้นใยไมคอร์ไรซาสำเร็จ!", "p2p"); window.isP2PConnected = true; document.getElementById('p2p-modal').style.display = 'none'; if(peerNode) peerNode.visible = true; if(peerLink) peerLink.visible = true; };
            dataChannel.onmessage = e => {
                const data = JSON.parse(e.data);
                if(data.type === 'GRAPH_POINTER') { logMsg(`รับสหาย Pointer: "${data.msg}"`, "p2p"); triggerManifestation(data.msg); }
            };
        }
        window.openP2P = () => { document.getElementById('p2p-modal').style.display = 'flex'; initP2P(); };
        window.copyMyOffer = () => { navigator.clipboard.writeText(document.getElementById('myOffer').value); logMsg("คัดลอกสปอร์แล้ว", "sys"); };
        window.createOffer = async () => { dataChannel = peerConnection.createDataChannel("Mycorrhiza"); setupChannel(); const offer = await peerConnection.createOffer(); await peerConnection.setLocalDescription(offer); logMsg("สร้างสปอร์แล้ว", "sys"); };
        window.acceptOffer = async () => { const offer = JSON.parse(atob(document.getElementById('friendOffer').value)); await peerConnection.setRemoteDescription(offer); const answer = await peerConnection.createAnswer(); await peerConnection.setLocalDescription(answer); logMsg("รับสปอร์แล้ว", "sys"); };
        window.finalizeConnection = async () => { const answer = JSON.parse(atob(document.getElementById('friendOffer').value)); await peerConnection.setRemoteDescription(answer); logMsg("ประสานจิตสำเร็จ", "sys"); };
        function sendTelepathy(msg) { if(window.isP2PConnected && dataChannel.readyState === 'open') dataChannel.send(JSON.stringify({ type: 'GRAPH_POINTER', msg: msg })); }

        // --- AUDIO & SPEECH ---
        let audioCtx;
        window.playTone = (freq, time, duration) => {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination); osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, audioCtx.currentTime + time);
            gain.gain.linearRampToValueAtTime(SYSTEM_CONFIG.AUDIO.synthVolume, audioCtx.currentTime + time + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + time + duration);
            osc.start(audioCtx.currentTime + time); osc.stop(audioCtx.currentTime + time + duration);
        };
        SYS.speakTTS = (text) => { if(!('speechSynthesis' in window)) return; window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang='th-TH'; window.speechSynthesis.speak(u); };

        // ฟังก์ชันศูนย์กลางในการสั่งแสดงผลโฮโลแกรม (Fixed Binding)
        window.triggerManifestation = (text) => {
            logMsg(`> Voxel AI: "${text}"`, "ai");
            sendTelepathy(text);
            switchState('MAGAZINE');
            bakeTextToVoxels(text);
            SYS.speakTTS(text);
        };

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        if(SpeechRecognition) {
            recognition = new SpeechRecognition(); recognition.lang = 'th-TH';
            recognition.onstart = () => { document.getElementById('btn-mic').classList.add('listening'); document.getElementById('btn-mic').innerText = "กำลังรับฟังกระแสกรรม..."; };
            recognition.onend = () => { document.getElementById('btn-mic').classList.remove('listening'); document.getElementById('btn-mic').innerText = "🎙️ ส่งกระแสจิตผ่านกราฟพอยเตอร์"; };
            recognition.onresult = async (e) => {
                const text = e.results[0][0].transcript;
                const karmaNode = karmaEngine.parseKarma(text);
                await karmaEngine.traverse(karmaEngine.stateGraph, karmaNode, (thoughtResult) => {
                    triggerManifestation(thoughtResult);
                });
            };
        }
        window.toggleListening = () => { if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); if(recognition) recognition.start(); };

        // --- THREE.JS 3D VOXEL ENGINE ---
        const scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x010203, 0.05);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100); 
        camera.position.set(SYSTEM_CONFIG.SCENE.cameraX, SYSTEM_CONFIG.SCENE.cameraY, SYSTEM_CONFIG.SCENE.cameraZ); 
        camera.lookAt(0, SYSTEM_CONFIG.SCENE.lookAtY, 0); 

        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl-canvas'), antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), SYSTEM_CONFIG.SCENE.bloomStrength, SYSTEM_CONFIG.SCENE.bloomRadius, SYSTEM_CONFIG.SCENE.bloomThreshold));

        const coreShape = new THREE.Mesh(
            new THREE.TorusKnotGeometry(SYSTEM_CONFIG.CORE.radius, SYSTEM_CONFIG.CORE.tube, SYSTEM_CONFIG.CORE.tubularSegments, SYSTEM_CONFIG.CORE.radialSegments), 
            new THREE.MeshBasicMaterial({ color: 0x00ff66, wireframe: true, transparent: true, opacity: 0.6 })
        );
        coreShape.position.y = SYSTEM_CONFIG.SCENE.elevation; scene.add(coreShape);

        let peerNode = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), new THREE.MeshStandardMaterial({ color: 0x00f3ff, emissive: 0x00f3ff, wireframe: true }));
        peerNode.visible = false; scene.add(peerNode);
        let peerLink = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]), new THREE.LineBasicMaterial({ color: 0x00f3ff, transparent: true, opacity: 0.5 }));
        peerLink.visible = false; scene.add(peerLink);

        const textMat = new THREE.MeshStandardMaterial({ color: 0x00ff66, emissive: 0x00ff66, emissiveIntensity: 1.2 });
        const shaderUniforms = { uTime: { value: 0 }, uMorph: { value: 0.0 } };
        textMat.onBeforeCompile = (shader) => {
            shader.uniforms.uTime = shaderUniforms.uTime; shader.uniforms.uMorph = shaderUniforms.uMorph;
            shader.vertexShader = `uniform float uTime; uniform float uMorph; attribute vec3 aTargetPos; attribute vec3 aRandomPos;` + shader.vertexShader;
            shader.vertexShader = shader.vertexShader.replace(`#include <begin_vertex>`, `
                vec3 idlePos = aRandomPos + vec3(sin(uTime+aRandomPos.x), cos(uTime+aRandomPos.y), sin(uTime+aRandomPos.z)) * 0.4;
                vec3 textPos = vec3(aTargetPos.x, aTargetPos.y, aTargetPos.z + sin(aTargetPos.x*2.0 - uTime*3.0)*0.1);
                vec3 transformed = mix(idlePos, textPos, uMorph);
            `);
        };

        const voxelMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(SYSTEM_CONFIG.VOXEL.size, SYSTEM_CONFIG.VOXEL.size, SYSTEM_CONFIG.VOXEL.size), textMat, SYSTEM_CONFIG.VOXEL.maxCount);
        const targetPosArray = new Float32Array(SYSTEM_CONFIG.VOXEL.maxCount * 3); 
        const randomPosArray = new Float32Array(SYSTEM_CONFIG.VOXEL.maxCount * 3);
        for(let i=0; i<SYSTEM_CONFIG.VOXEL.maxCount; i++) {
            randomPosArray[i*3] = (Math.random()-0.5)*SYSTEM_CONFIG.VOXEL.spreadArea; 
            randomPosArray[i*3+1] = (Math.random()-0.5)*SYSTEM_CONFIG.VOXEL.spreadArea + SYSTEM_CONFIG.SCENE.elevation; 
            randomPosArray[i*3+2] = (Math.random()-0.5)*SYSTEM_CONFIG.VOXEL.spreadArea;
        }
        voxelMesh.geometry.setAttribute('aTargetPos', new THREE.InstancedBufferAttribute(targetPosArray, 3));
        voxelMesh.geometry.setAttribute('aRandomPos', new THREE.InstancedBufferAttribute(randomPosArray, 3));
        voxelMesh.visible = false; scene.add(voxelMesh); scene.add(new THREE.AmbientLight(0xffffff, 0.6));

        window.bakeTextToVoxels = (text) => {
            const sd = document.getElementById('shadow-dom'); sd.innerHTML = ''; 
            for(let char of text) sd.innerHTML += (char === ' ') ? '<span>&nbsp;</span>' : `<span>${char}</span>`;
            setTimeout(() => {
                const spans = sd.querySelectorAll('span'); const sdRect = sd.getBoundingClientRect(); let voxelIdx = 0;
                spans.forEach((span) => {
                    if(span.innerText.trim() === '' || voxelIdx >= SYSTEM_CONFIG.VOXEL.maxCount) return;
                    const r = span.getBoundingClientRect(); 
                    const x3d = (r.left - sdRect.left - (sdRect.width/2)) * SYSTEM_CONFIG.TYPOGRAPHY.scale; 
                    const y3d = -(r.top - sdRect.top - (sdRect.height/2)) * SYSTEM_CONFIG.TYPOGRAPHY.scale + SYSTEM_CONFIG.TYPOGRAPHY.elevationOffset; 
                    for(let v=0; v<SYSTEM_CONFIG.TYPOGRAPHY.densityPerChar; v++) {
                        if(voxelIdx >= SYSTEM_CONFIG.VOXEL.maxCount) break;
                        targetPosArray[voxelIdx*3] = x3d + (Math.random()-0.5)*SYSTEM_CONFIG.TYPOGRAPHY.jitter;
                        targetPosArray[voxelIdx*3+1] = y3d + (Math.random()-0.5)*SYSTEM_CONFIG.TYPOGRAPHY.jitter;
                        targetPosArray[voxelIdx*3+2] = (Math.random()-0.5)*SYSTEM_CONFIG.TYPOGRAPHY.depth;
                        voxelIdx++;
                    }
                });
                voxelMesh.geometry.attributes.aTargetPos.needsUpdate = true; voxelMesh.count = voxelIdx; 
            }, 30);
        };

        window.switchState = (state) => {
            SYS.state = state;
            document.querySelectorAll('.btn-grid .btn-glass').forEach(b => b.classList.remove('active'));
            document.getElementById(state === 'ZEN' ? 'btn-zen' : 'btn-mag').classList.add('active');
            if(state === 'ZEN') { coreShape.visible = true; } 
            else if (state === 'MAGAZINE') { voxelMesh.visible = true; coreShape.visible = false; }
        };

        const clock = new THREE.Clock();
        function render() {
            requestAnimationFrame(render);
            const dt = clock.getDelta(); const t = clock.getElapsedTime();

            if(coreShape.visible) { coreShape.rotation.x += dt * SYSTEM_CONFIG.CORE.speedX; coreShape.rotation.y += dt * SYSTEM_CONFIG.CORE.speedY; }
            if(peerNode.visible) {
                peerNode.position.x = Math.sin(t * 0.5) * 4.0; peerNode.position.z = Math.cos(t * 0.5) * 4.0;
                peerNode.position.y = SYSTEM_CONFIG.SCENE.elevation + Math.sin(t * 0.8) * 1.5; peerNode.rotation.y += dt;
                const pos = peerLink.geometry.attributes.position.array;
                pos[0] = coreShape.position.x; pos[1] = coreShape.position.y; pos[2] = coreShape.position.z;
                pos[3] = peerNode.position.x; pos[4] = peerNode.position.y; pos[5] = peerNode.position.z;
                peerLink.geometry.attributes.position.needsUpdate = true;
            }
            if(voxelMesh.visible) {
                shaderUniforms.uTime.value = t;
                shaderUniforms.uMorph.value += ((SYS.state === 'MAGAZINE' ? 1.0 : 0.0) - shaderUniforms.uMorph.value) * dt * SYSTEM_CONFIG.VOXEL.morphSpeed;
                voxelMesh.rotation.y = Math.sin(t * 0.5) * 0.1;
                if(SYS.state === 'ZEN' && shaderUniforms.uMorph.value < 0.05) voxelMesh.visible = false;
            }
            composer.render();
        }

        logMsg("Voxel AI OS : Connected Master Ready", "sys");
        render();
        triggerManifestation("Voxel AI OS : Ready");
    </script>
</body>
</html>
